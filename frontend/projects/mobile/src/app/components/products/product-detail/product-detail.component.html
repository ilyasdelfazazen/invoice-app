<div class="page">
  <div class="page-header">
    <ion-button fill="clear" (click)="router.navigate(['/products'])">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>
    <h2>{{ product.designation }}</h2>
    <ion-button size="small" (click)="router.navigate(['/products', product._id, 'edit'])">
      <ion-icon slot="start" name="pencil-outline"></ion-icon>
      {{ 'common.edit' | translate }}
    </ion-button>
  </div>

  <ion-list class="detail-card">
    <ion-item>
      <ion-icon name="barcode-outline" slot="start" color="medium"></ion-icon>
      <ion-label>
        <p class="label">{{ 'products.ref' | translate }}</p>
        <h3><span class="ref-badge">{{ product.ref }}</span></h3>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="cube-outline" slot="start" color="medium"></ion-icon>
      <ion-label>
        <p class="label">{{ 'products.designation' | translate }}</p>
        <h3>{{ product.designation }}</h3>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="cash-outline" slot="start" color="medium"></ion-icon>
      <ion-label>
        <p class="label">{{ 'products.unitPriceHt' | translate }}</p>
        <h3 class="price">{{ product.unit_price_ht | number:'1.2-2' }} MAD</h3>
      </ion-label>
    </ion-item>
  </ion-list>
</div>
