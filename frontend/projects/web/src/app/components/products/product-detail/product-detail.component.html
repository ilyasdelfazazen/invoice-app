<div class="page">
  <div class="page-header">
    <button pButton icon="pi pi-arrow-left" class="p-button-text"
            (click)="router.navigate(['/products'])"></button>
    <h2>{{ product.designation }}</h2>
    <button pButton icon="pi pi-pencil" [label]="'common.edit' | translate"
            (click)="router.navigate(['/products', product._id, 'edit'])"></button>
  </div>

  <div class="detail-card">
    <div class="detail-row">
      <span class="label">{{ 'products.ref' | translate }}</span>
      <span class="ref-badge">{{ product.ref }}</span>
    </div>
    <div class="detail-row">
      <span class="label">{{ 'products.designation' | translate }}</span>
      <span>{{ product.designation }}</span>
    </div>
    <div class="detail-row">
      <span class="label">{{ 'products.unitPriceHt' | translate }}</span>
      <span class="price">{{ product.unit_price_ht | number:'1.2-2' }} MAD</span>
    </div>
  </div>
</div>
